spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.mvc.routes[0].id=user-management
spring.cloud.gateway.mvc.routes[0].uri=lb://user-management
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**, /api/patients/**, /api/admin/**

spring.cloud.gateway.mvc.routes[1].id=appointment-service
spring.cloud.gateway.mvc.routes[1].uri=lb://appointment-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/appointments/**, /api/appointments

spring.cloud.gateway.mvc.routes[2].id=telemedicine-service
spring.cloud.gateway.mvc.routes[2].uri=lb://telemedicine-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/telemedicine/**
