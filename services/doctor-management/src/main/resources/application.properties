spring.application.name=doctor-management

server.port=8085

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/doctor_management_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT Configuration
app.jwtSecret=hospitalManagementSecretKeyThatIsVeryLongAndSecureEnoughForHS512Algorithm
app.jwtExpirationMs=86400000

# File upload limits (for profile photos & reports)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
