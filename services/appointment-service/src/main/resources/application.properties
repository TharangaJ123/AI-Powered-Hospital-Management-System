spring.application.name=appointment-service
server.port=8083

spring.datasource.url=jdbc:mysql://mysql-3fc27ccf-chathuratharanga076-c0b5.b.aivencloud.com:20281/defaultdb?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION:86400000}
 
# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.datasource.hikari.maximum-pool-size=2

# Notification Service Configuration
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
