version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  discovery-service:
    build:
      context: .
      dockerfile: infrastructure/discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8099:8099"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  user-management:
    build:
      context: .
      dockerfile: services/user-management/Dockerfile
    container_name: user-management
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  appointment-service:
    build:
      context: .
      dockerfile: services/appointment-service/Dockerfile
    container_name: appointment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - DOCTOR_MANAGEMENT_URL=http://doctor-management:8082
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  doctor-management:
    build:
      context: .
      dockerfile: services/doctor-management/Dockerfile
    container_name: doctor-management
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  telemedicine-service:
    build:
      context: .
      dockerfile: services/telemedicine-service/Dockerfile
    container_name: telemedicine-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  ai-symptom-service:
    build:
      context: .
      dockerfile: services/ai-symptom-service/Dockerfile
    container_name: ai-symptom-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_MAIL_USERNAME=${MAIL_USER:-omnihealth628@gmail.com}
      - SPRING_MAIL_PASSWORD=${MAIL_PASS:-lyvhhjsswgeseazc}
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  contact-service:
    build:
      context: .
      dockerfile: services/contact-service/Dockerfile
    container_name: contact-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    container_name: review-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: web-client
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8099
    depends_on:
      - api-gateway
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge