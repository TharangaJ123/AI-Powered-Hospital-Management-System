version: "3.9"

services:
  # Centralized registry for all microservices in the hospital network
  discovery-service:
    build:
      context: .
      dockerfile: infrastructure/discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - hospital-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Central entry point that routes external traffic to specific services
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8099:8099"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Manages patient and staff authentication and profile data
  user-management:
    build:
      context: .
      dockerfile: services/user-management/Dockerfile
    container_name: user-management
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - DOCTOR_MANAGEMENT_URL=http://doctor-management:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Handles the scheduling and status tracking of medical appointments
  appointment-service:
    build:
      context: .
      dockerfile: services/appointment-service/Dockerfile
    container_name: appointment-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - DOCTOR_MANAGEMENT_URL=http://doctor-management:8082
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Stores and manages detailed clinical profiles for doctors
  doctor-management:
    build:
      context: .
      dockerfile: services/doctor-management/Dockerfile
    container_name: doctor-management
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Orchestrates virtual consultation sessions via WebRTC or external links
  telemedicine-service:
    build:
      context: .
      dockerfile: services/telemedicine-service/Dockerfile
    container_name: telemedicine-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Uses AI models to analyze symptoms and provide medical suggestions
  ai-symptom-service:
    build:
      context: .
      dockerfile: services/ai-symptom-service/Dockerfile
    container_name: ai-symptom-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Hub for dispatching transactional Email and SMS alerts
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_MAIL_USERNAME=${MAIL_USER:-omnihealth628@gmail.com}
      - SPRING_MAIL_PASSWORD=${MAIL_PASS:-lyvhhjsswgeseazc}
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Manages general support inquiries and contact form submissions
  contact-service:
    build:
      context: .
      dockerfile: services/contact-service/Dockerfile
    container_name: contact-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Collects and displays patient feedback and provider ratings
  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    container_name: review-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # Processes financial transactions and payment gateway integrations
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - APPOINTMENT_SERVICE_URL=http://appointment-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - hospital-network

  # The React-based user interface served via Nginx
  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: web-client
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8099
    depends_on:
      - api-gateway
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge
