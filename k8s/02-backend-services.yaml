# ============================================================
# User Management Service (port 8081)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management # Backend service for user accounts and profiles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-management
  template:
    metadata:
      labels:
        app: user-management
    spec:
      containers:
      - name: user-management
        image: ai-powered-hospital-management-system-user-management:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081 # Exposed port for authentication and profile management
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_SERVER
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        - name: DOCTOR_MANAGEMENT_URL
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: DOCTOR_MANAGEMENT_URL
        - name: NOTIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: NOTIFICATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: user-management
spec:
  selector:
    app: user-management
  ports:
  - port: 8081
    targetPort: 8081

