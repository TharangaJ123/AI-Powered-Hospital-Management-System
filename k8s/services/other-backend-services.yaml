# Doctor Management
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-management
spec:
  selector:
    matchLabels:
      app: doctor-management
  template:
    metadata:
      labels:
        app: doctor-management
    spec:
      containers:
      - name: doctor-management
        image: doctor-management:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql-service:3306/hospital_db?useSSL=false
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hospital-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_SERVER
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-management
spec:
  selector:
    app: doctor-management
  ports:
    - port: 8082
      targetPort: 8082

