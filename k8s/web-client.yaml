apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
spec:
  selector:
    matchLabels:
      app: web-client
  template:
    metadata:
      labels:
        app: web-client
    spec:
      containers:
      - name: web-client
        image: web-client:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_BASE_URL
          value: "http://localhost:30099" # Points to the NodePort of the API Gateway
---
apiVersion: v1
kind: Service
metadata:
  name: web-client
spec:
  type: NodePort
  selector:
    app: web-client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
