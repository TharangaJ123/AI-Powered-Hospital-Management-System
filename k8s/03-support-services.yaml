# ============================================================
# AI Symptom Service (port 8089) - with Gemini API key
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-service # Supporting service for AI-driven diagnostic analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-symptom-service
  template:
    metadata:
      labels:
        app: ai-symptom-service
    spec:
      containers:
      - name: ai-symptom-service
        image: ai-powered-hospital-management-system-ai-symptom-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8089
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_SERVER
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hospital-secrets
              key: GEMINI_API_KEY
        # This service maps the AI API key from the encrypted hospital-secrets Secret
        - name: GEMINI_API_URL
          value: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-service
spec:
  selector:
    app: ai-symptom-service
  ports:
  - port: 8089
    targetPort: 8089
