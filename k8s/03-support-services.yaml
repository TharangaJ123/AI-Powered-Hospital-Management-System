# ============================================================
# Notification Service (port 8085)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service # Supporting service for Email and SMS dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: ai-powered-hospital-management-system-notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_SERVER
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: hospital-config
              key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: hospital-secrets
              key: MAIL_USER
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hospital-secrets
              key: MAIL_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - port: 8085
    targetPort: 8085

